# MedZone full-stack environment: MySQL + Express API + web frontend.
#
# Boot:
#   cp .env.example .env    # then set real JWT_SECRET, PHI_ENCRYPTION_KEY,
#                           # MYSQL_ROOT_PASSWORD, DB_PASSWORD (and ADMIN_PASSWORD
#                           # for the first administrator) — the stack refuses
#                           # to start without the API secrets.
#   docker compose up -d --build
#   docker compose run --rm api npm run db:setup   # schema + seed (first boot)
#   open http://localhost:3000
#
# Notes:
# - Host ports are configurable when they clash with other projects:
#   WEB_PORT=3002 API_PORT=3001 DB_HOST_PORT=3307 docker compose up -d
#   Inside the compose network the API always uses DB_HOST=mysql:3306.
# - The API runs with NODE_ENV=production by default: JWT_SECRET and
#   PHI_ENCRYPTION_KEY are mandatory and the dashboard/session flows enforce
#   the production secret policy. Set NODE_ENV=development explicitly for a
#   throwaway local stack with the built-in dev fallbacks.
# - DB and API ports bind to 127.0.0.1 only: the web container is the single
#   network entry point and proxies /api to the API internally.
# - Web build args: VITE_API_URL stays empty (same-origin nginx proxy).
#   There is no browser-side PHI key: visit transcripts are encrypted at rest
#   by the API under PHI_ENCRYPTION_KEY, and the browser receives plaintext only
#   over TLS for the visits the caller may read.
services:
  mysql:
    image: mysql:8.4
    container_name: medzone-mysql
    restart: unless-stopped
    # Tuned for burst concurrency (e.g. 500 users in one go):
    # max-connections must exceed DB_POOL_SIZE x WORKERS across API processes.
    command:
      - --max-connections=300
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=128M
      - --table-open-cache=2000
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required — set it in .env (see .env.example)}
      MYSQL_DATABASE: ${DB_NAME:-medzone}
      MYSQL_USER: ${DB_USER:-medzone}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — set it in .env (see .env.example)}
    ports:
      # Loopback only: the database is never exposed on the LAN.
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - medzone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USER:-medzone}", "-p${DB_PASSWORD:-medzone}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: medzone-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3001"
      NODE_ENV: "${NODE_ENV:-production}"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "${DB_USER:-medzone}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required — set it in .env (see .env.example)}"
      DB_NAME: "${DB_NAME:-medzone}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-25}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required — generate one with node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\"}"
      PHI_ENCRYPTION_KEY: "${PHI_ENCRYPTION_KEY:?PHI_ENCRYPTION_KEY is required — generate one with node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\"}"
      # First administrator (used only when the users table has no admin yet).
      # In production the seed refuses to run without a real value.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_DISPLAY_NAME: "${ADMIN_DISPLAY_NAME:-Administrator}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Require a second factor on every session. Each account enrolls its own
      # authenticator (Security → MFA); a session that has not enrolled is told
      # to, and one that has must verify before clinical routes answer.
      MFA_REQUIRED: "${MFA_REQUIRED:-false}"
      # Deprecated deployment-wide secret: setting it now only turns enforcement
      # on, and it never verifies a code.
      MFA_TOTP_SECRET: "${MFA_TOTP_SECRET:-}"
      # The API runs behind exactly one proxy hop (the web container's nginx),
      # so Express reads the real client address from X-Forwarded-*.
      TRUST_PROXY: "1"
      # Set COOKIE_SECURE=true when TLS terminates in front of the stack.
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
    ports:
      # Loopback only: browsers talk to the web container, which proxies /api.
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ""
    container_name: medzone-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  medzone_mysql_data:
