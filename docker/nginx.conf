# MedZone web reverse proxy.
#
# Same-origin /api/* -> `api:3001` (mirrors the Vite dev-server proxy in
# vite.config.ts, so the browser client works unchanged). Everything else is
# the SPA with a fallback to index.html.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 50+ pairs: bootstrap/login JSON is text — gzip it on the wire. Images and
  # the hashed JS/CSS bundle already carry their own encoding/caching.
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain;
  gzip_proxied any;

  # API reverse proxy (same-origin for the browser; avoids CORS entirely).
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Preserve the browser-facing host:port for the API's exact-origin CSRF
    # check when the container is published on a non-default port.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Burst headroom: 100 users revalidating at once should queue, not drop.
    limit_conn_status 503;
  }

  # Vite emits hashed filenames under /assets/: safe to cache long-term.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA entry + fallback: never cached (clinical shell must stay fresh).
  location / {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
